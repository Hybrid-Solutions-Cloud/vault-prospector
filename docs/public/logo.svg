<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vault Prospector">
  <title>Vault Prospector</title>
  <defs>
    <linearGradient id="vpRing" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b8ae0"/>
      <stop offset="1" stop-color="#0b5cab"/>
    </linearGradient>
  </defs>

  <!-- Vault door ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#vpRing)" stroke-width="5"/>

  <!-- Bolt notches, at the four corners of the door -->
  <g fill="url(#vpRing)">
    <rect x="30" y="1" width="4" height="7" rx="2"/>
    <rect x="30" y="56" width="4" height="7" rx="2"/>
    <rect x="1" y="30" width="7" height="4" rx="2"/>
    <rect x="56" y="30" width="7" height="4" rx="2"/>
  </g>

  <!-- Magnifier: the prospecting half of the mark -->
  <g fill="none" stroke="#f2a541" stroke-width="5" stroke-linecap="round">
    <circle cx="28" cy="28" r="11"/>
    <line x1="36.5" y1="36.5" x2="46" y2="46"/>
  </g>
</svg>
