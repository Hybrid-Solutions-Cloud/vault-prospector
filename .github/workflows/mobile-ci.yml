name: Mobile CI

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'mobile/**'
      - 'scripts/Build-Mobile.ps1'
      - 'src/VaultProspector.Application/**'
      - 'src/VaultProspector.BrowserProtocol/**'
      - 'src/VaultProspector.Domain/**'
      - 'src/VaultProspector.Infrastructure/**'
      - 'src/VaultProspector.Providers.Azure/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ci.yml'
      - 'mobile/**'
      - 'scripts/Build-Mobile.ps1'
      - 'src/VaultProspector.Application/**'
      - 'src/VaultProspector.BrowserProtocol/**'
      - 'src/VaultProspector.Domain/**'
      - 'src/VaultProspector.Infrastructure/**'
      - 'src/VaultProspector.Providers.Azure/**'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-tests:
    runs-on: [self-hosted, linux, ubuntu-22.04, hcs]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Test shared mobile implementation
        shell: pwsh
        run: ./scripts/Build-Mobile.ps1 -Platform Managed

  android-package:
    runs-on: [self-hosted, linux, ubuntu-22.04, hcs]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: microsoft
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install pinned Android SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install pinned Android workload set
        shell: pwsh
        working-directory: mobile
        run: dotnet workload install android --skip-manifest-update
      - name: Build Android App Bundle
        shell: pwsh
        run: ./scripts/Build-Mobile.ps1 -Platform Android

  ios-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Select workload-compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.0.1'
      - name: Install pinned iOS workload set
        shell: pwsh
        working-directory: mobile
        run: dotnet workload install ios --skip-manifest-update
      - name: Build unsigned iOS simulator application
        shell: pwsh
        run: ./scripts/Build-Mobile.ps1 -Platform iOS
