name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore VaultProspector.sln --locked-mode
      - name: Verify formatting
        run: dotnet format VaultProspector.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build VaultProspector.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VaultProspector.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Build Windows installer and package manifests
        shell: pwsh
        run: |
          ./scripts/PackageInstaller.ps1 -Version 0.0.0-preview.1
          ./scripts/PackageDistribution.ps1 -Version 0.0.0-preview.1
          winget validate --manifest ./artifacts/distribution/winget/HybridSolutionsCloud.VaultProspector/0.0.0-preview.1
      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/Test-VulnerablePackages.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.4
          cache: false
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan Git history for secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
