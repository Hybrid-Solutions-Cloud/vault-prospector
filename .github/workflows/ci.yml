name: CI

env:
  CI_CANDIDATE_VERSION: 0.1.0-ci.${{ github.run_number }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore VaultProspector.sln --locked-mode
      - name: Verify formatting
        run: dotnet format VaultProspector.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build VaultProspector.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VaultProspector.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts, tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $parseErrors += $errors }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "$($parseErrors.Count) PowerShell parser error(s) found."
          }
      - name: Build Windows installer and package manifests
        shell: pwsh
        run: |
          ./scripts/PackageInstaller.ps1 -Version $env:CI_CANDIDATE_VERSION
          ./scripts/Test-InstallerUpgradeSchedule.ps1 -InstallerPath "./artifacts/VaultProspector-$env:CI_CANDIDATE_VERSION-win-x64.msi"
          ./scripts/PackageDistribution.ps1 -Version $env:CI_CANDIDATE_VERSION
          winget validate --manifest "./artifacts/distribution/winget/HybridSolutionsCloud.VaultProspector/$env:CI_CANDIDATE_VERSION"

          $installer = Get-Item "./artifacts/VaultProspector-$env:CI_CANDIDATE_VERSION-win-x64.msi"
          $provenance = [ordered]@{
            schemaVersion = 1
            candidateVersion = $env:CI_CANDIDATE_VERSION
            sourceCommit = '${{ github.sha }}'
            sourceRef = '${{ github.ref }}'
            workflowRunId = '${{ github.run_id }}'
            workflowRunAttempt = '${{ github.run_attempt }}'
            repository = '${{ github.repository }}'
            createdAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            installer = [ordered]@{
              name = $installer.Name
              length = $installer.Length
              sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
            }
          }
          $provenance | ConvertTo-Json -Depth 4 | Set-Content ./artifacts/ci-candidate.json -Encoding utf8NoBOM
      - name: Check vulnerable dependencies
        shell: pwsh
        run: ./scripts/Test-VulnerablePackages.ps1
      - name: Upload commit-addressed Windows candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-candidate-${{ github.sha }}
          path: |
            artifacts/VaultProspector-${{ env.CI_CANDIDATE_VERSION }}-win-x64.msi
            artifacts/VaultProspector-${{ env.CI_CANDIDATE_VERSION }}-win-x64.msi.sha256
            artifacts/VaultProspector-${{ env.CI_CANDIDATE_VERSION }}-winget-manifests.zip
            artifacts/VaultProspector-${{ env.CI_CANDIDATE_VERSION }}-winget-manifests.zip.sha256
            artifacts/vault-prospector.${{ env.CI_CANDIDATE_VERSION }}.nupkg
            artifacts/vault-prospector.${{ env.CI_CANDIDATE_VERSION }}.nupkg.sha256
            artifacts/ci-candidate.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: TestResults

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.4
          cache: false
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan Git history for secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
