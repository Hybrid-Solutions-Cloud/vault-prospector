name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    # Governed fallback while the HCS org runner registration credential is unavailable.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # VitePress `lastUpdated` reads Git commit times.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore locked dependencies
        run: npm ci
      - name: Build site
        run: npm run docs:build
      # The site ships no runtime dependencies, so the production audit must stay clean.
      # The dev-dependency audit is reported but not enforced: VitePress 1.6.4 is the latest
      # stable release and its open vite/esbuild advisories affect only the dev server, which CI
      # never runs. Re-evaluate when a fixed VitePress release exists.
      - name: Check documentation dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    # Governed fallback while the HCS org runner registration credential is unavailable.
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
