name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release
      - name: Package Windows release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/Package.ps1 -Version $version
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/publish-win-x64
          format: spdx-json
          output-file: artifacts/VaultProspector-${{ github.ref_name }}-win-x64.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/VaultProspector-*.zip
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release archive with Sigstore
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/VaultProspector-*.zip | Select-Object -First 1
          cosign sign-blob --yes --bundle "$($archive.FullName).sigstore.json" $archive.FullName
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/VaultProspector-*.zip
            artifacts/VaultProspector-*.sha256
            artifacts/VaultProspector-*.spdx.json
            artifacts/VaultProspector-*.sigstore.json
