name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    env:
      AZURE_CLIENT_ID: ${{ vars.ARTIFACT_SIGNING_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.ARTIFACT_SIGNING_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Resolve release version and signing paths
        id: release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $unsignedPreviewAllowed = $version -match '^\d+\.\d+\.\d+-preview\.\d+$'
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=${{ github.workspace }}\artifacts\VaultProspector-$version-win-x64.msi" >> $env:GITHUB_OUTPUT
          "unsigned_preview_allowed=$($unsignedPreviewAllowed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Resolve Artifact Signing mode
        id: signing
        shell: pwsh
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_ACCOUNT',
            'ARTIFACT_SIGNING_PROFILE'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          $configured = $missing.Count -eq 0
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($missing.Count -gt 0) {
            if ('${{ steps.release.outputs.unsigned_preview_allowed }}' -ne 'true') {
              throw "Unsigned stable/GA releases are prohibited. Configure the release environment variables documented in docs/artifact-signing.md. Missing: $($missing -join ', ')."
            }
            Write-Warning 'Publishing an explicitly labeled unsigned Preview evaluation release. Windows will show Unknown Publisher; stable and GA tags remain blocked.'
          }
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release
      - name: Publish Windows application
        shell: pwsh
        run: ./scripts/Package.ps1 -Version '${{ steps.release.outputs.version }}' -SkipArchive
      - name: Authenticate to Azure with release OIDC identity
        if: steps.signing.outputs.configured == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Sign application binaries with Azure Artifact Signing
        if: steps.signing.outputs.configured == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\publish-win-x64
          files-folder-filter: VaultProspector*.dll,VaultProspector*.exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-digest: SHA256
          description: Vault Prospector
          description-url: https://github.com/Hybrid-Solutions-Cloud/vault-prospector
      - name: Verify signed application binaries
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem '${{ github.workspace }}\artifacts\publish-win-x64' -Recurse -File |
              Where-Object { $_.Name -like 'VaultProspector*.exe' -or $_.Name -like 'VaultProspector*.dll' }
          )
          if ($targets.Count -eq 0) { throw 'No application binaries were selected for signature verification.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode or timestamp verification failed for '$($target.FullName)': $($signature.Status)."
            }
          }
      - name: Verify explicit unsigned Preview boundary
        if: steps.signing.outputs.configured != 'true'
        shell: pwsh
        run: |
          $targets = @(
            Get-ChildItem '${{ github.workspace }}\artifacts\publish-win-x64' -Recurse -File |
              Where-Object { $_.Name -like 'VaultProspector*.exe' -or $_.Name -like 'VaultProspector*.dll' }
          )
          if ($targets.Count -eq 0) { throw 'No application binaries were selected for unsigned-boundary verification.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Unsigned Preview boundary expected NotSigned for '$($target.FullName)' but found $($signature.Status)."
            }
          }
      - name: Archive portable application
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $archive = '${{ github.workspace }}\artifacts\VaultProspector-' + $version + '-win-x64.zip'
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path '${{ github.workspace }}\artifacts\publish-win-x64\*' -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $(Split-Path -Leaf $archive)" -Encoding utf8NoBOM
      - name: Build MSI from packaged binaries
        shell: pwsh
        run: ./scripts/PackageInstaller.ps1 -Version '${{ steps.release.outputs.version }}' -SkipPublish
      - name: Verify rollback-safe MSI sequence
        shell: pwsh
        run: ./scripts/Test-InstallerUpgradeSchedule.ps1 -InstallerPath '${{ steps.release.outputs.installer }}'
      - name: Verify Start-menu shortcut icon
        shell: pwsh
        run: ./scripts/Test-InstallerShortcutIcon.ps1 -InstallerPath '${{ steps.release.outputs.installer }}'
      - name: Verify browser extension source and native host registration
        shell: pwsh
        run: |
          npm test --prefix browser-extension
          npm run build --prefix browser-extension
          ./scripts/Test-BrowserHostInstaller.ps1 -InstallerPath '${{ steps.release.outputs.installer }}' -PublishDirectory '${{ github.workspace }}\artifacts\publish-win-x64'
      - name: Sign MSI with Azure Artifact Signing
        if: steps.signing.outputs.configured == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.release.outputs.installer }}
          file-digest: SHA256
          timestamp-digest: SHA256
          description: Vault Prospector Windows Installer
          description-url: https://github.com/Hybrid-Solutions-Cloud/vault-prospector
      - name: Verify MSI signature and build distribution metadata
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          $installer = '${{ steps.release.outputs.installer }}'
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($env:SIGNING_CONFIGURED -eq 'true') {
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "MSI Authenticode or timestamp verification failed: $($signature.Status)."
            }
          }
          elseif ($signature.Status -ne 'NotSigned') {
            throw "Unsigned Preview boundary expected an unsigned MSI but found $($signature.Status)."
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $(Split-Path -Leaf $installer)" -Encoding utf8NoBOM
          ./scripts/PackageDistribution.ps1 -Version '${{ steps.release.outputs.version }}'
          winget validate --manifest "./artifacts/distribution/winget/HybridSolutionsCloud.VaultProspector/${{ steps.release.outputs.version }}"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/publish-win-x64
          format: spdx-json
          output-file: artifacts/VaultProspector-${{ github.ref_name }}-win-x64.spdx.json
      - name: Normalize SBOM file name
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Move-Item "artifacts/VaultProspector-${{ github.ref_name }}-win-x64.spdx.json" "artifacts/VaultProspector-$version-win-x64.spdx.json"
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/VaultProspector-*.msi
            artifacts/VaultProspector-*.zip
            artifacts/vault-prospector.*.nupkg
      - name: Note private-repository attestation boundary
        if: ${{ github.event.repository.visibility != 'public' }}
        shell: pwsh
        run: Write-Host 'GitHub-native artifact attestations are unavailable for this private repository on the current organization plan; publishing the keyless Sigstore bundle instead.'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release packages with Sigstore
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem artifacts -File |
              Where-Object Extension -in '.msi', '.zip', '.nupkg'
          )
          foreach ($package in $packages) {
            cosign sign-blob --yes --bundle "$($package.FullName).sigstore.json" $package.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Sigstore signing failed for '$($package.Name)' with exit code $LASTEXITCODE."
            }
          }
      - name: Write release classification
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $releaseBody = 'artifacts/release-body.md'
          if ('${{ steps.signing.outputs.configured }}' -eq 'true') {
            @'
          This release is Authenticode signed and timestamped. Verify the published checksums and Sigstore bundles before installation.
          '@ | Set-Content $releaseBody -Encoding utf8NoBOM
          }
          else {
            @'
          > [!WARNING]
          > This is an unsigned Windows Preview evaluation release. Windows will display **Unknown Publisher**. Use it for non-production evaluation while trusted signing remains a GA gate.

          The MSI, portable ZIP, package-manager candidates, checksums, SPDX SBOM, and keyless Sigstore bundles were produced by the protected release workflow from this immutable tag.
          '@ | Set-Content $releaseBody -Encoding utf8NoBOM
          }
          $notes = "docs/release-notes/$version.md"
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            Add-Content -LiteralPath $releaseBody -Value "`n" -Encoding utf8NoBOM
            Get-Content -LiteralPath $notes -Raw | Add-Content -LiteralPath $releaseBody -Encoding utf8NoBOM
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: artifacts/release-body.md
          files: |
            artifacts/VaultProspector-*.zip
            artifacts/VaultProspector-*.msi
            artifacts/VaultProspector-*.sha256
            artifacts/VaultProspector-*.spdx.json
            artifacts/VaultProspector-*.sigstore.json
            artifacts/vault-prospector.*.nupkg
            artifacts/vault-prospector.*.sha256
            artifacts/vault-prospector.*.sigstore.json
