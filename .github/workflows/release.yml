name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release
      - name: Package Windows release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/Package.ps1 -Version $version
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/publish-win-x64
          format: spdx-json
          output-file: artifacts/VaultProspector-${{ github.ref_name }}-win-x64.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/VaultProspector-*.zip
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign release archive with Sigstore
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/VaultProspector-*.zip | Select-Object -First 1
          cosign sign-blob --yes --bundle "$($archive.FullName).sigstore.json" $archive.FullName
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/VaultProspector-*.zip
            artifacts/VaultProspector-*.sha256
            artifacts/VaultProspector-*.spdx.json
            artifacts/VaultProspector-*.sigstore.json
